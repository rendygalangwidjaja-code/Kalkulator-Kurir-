name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Create Web Build Directory
        run: |
          mkdir -p www assets
          cp index.html www/index.html
          cp logo.png assets/icon.png 2>/dev/null || true
          cp logo.png assets/logo.png 2>/dev/null || true

      - name: Install Dependencies & Assets Tool
        run: |
          npm install
          npm install -D @capacitor/assets

      - name: Add Android Platform
        run: |
          npx cap add android
          npx cap sync android

      - name: Generate App Icons
        run: |
          npx capacitor-assets generate --iconAvailable

      - name: Build Unsigned APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kalkulator-Kurir-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
